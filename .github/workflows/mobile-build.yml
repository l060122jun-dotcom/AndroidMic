name: Chinese Android and unsigned iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protobuf compiler
        run: choco install protoc -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: RustApp -> target
      - name: Test and build low-latency desktop client
        working-directory: RustApp
        run: |
          cargo test --lib
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidMic-Windows-low-latency
          path: RustApp/target/release/android-mic.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Build Chinese APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidMic-Chinese-APK
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: iOS
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Test TCP packet encoder
        working-directory: iOS
        run: |
          swiftc Sources/AudioPacketEncoder.swift Tests/main.swift -o /tmp/androidmic-protocol-test
          /tmp/androidmic-protocol-test
      - name: Test SPSC audio ring
        working-directory: iOS
        run: |
          clang -std=c11 -O2 -Wall -Wextra -pthread Sources/AudioRingBuffer.c Tests/ring_test.c -o /tmp/androidmic-ring-test
          /tmp/androidmic-ring-test
      - name: Build unsigned device application
        working-directory: iOS
        run: |
          set -o pipefail
          xcodebuild -project AndroidMicIOS.xcodeproj -scheme AndroidMicIOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build.log
      - name: Package unsigned IPA
        working-directory: iOS
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/AndroidMicIOS.app dist/Payload/
          cd dist
          zip -qr AndroidMic-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidMic-iOS-unsigned-IPA
          path: iOS/dist/AndroidMic-iOS-unsigned.ipa
          if-no-files-found: error
